name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: src
        run: python tests/test_pipeline.py
      - name: Validate layers
        env:
          PYTHONPATH: src
        run: python -m warm_company validate-layers
      - name: Provenance and generation
        env:
          PYTHONPATH: src
        run: |
          python -m warm_company provenance
          python -m warm_company generate --phase 9
          python -m warm_company validate-collection
