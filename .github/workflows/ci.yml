name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: src
        run: python tests/test_pipeline.py
      - name: Preflight
        env:
          PYTHONPATH: src
        run: python -m warm_company preflight --phase 9
