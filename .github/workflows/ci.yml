name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Status
        env:
          PYTHONPATH: src
        run: python -m warm_company status
      - name: Tests
        env:
          PYTHONPATH: src
        run: python tests/test_pipeline.py
      - name: Preflight
        env:
          PYTHONPATH: src
        run: python -m warm_company preflight --phase 9
